# Arma el paquete del sitio para la extensión Node.js de Plesk (MegaLink): compila en Linux, como el
# servidor, y deja un zip listo para subir y descomprimir. El hosting no instala ni compila nada.
# Guía de instalación: docs/despliegue.md
name: Paquete para Plesk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  paquete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # La misma versión que el hosting
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # pnpm en la versión fijada en package.json (packageManager)
      - run: corepack enable

      # Dependencias como carpetas reales: el Administrador de archivos de Plesk no conserva los
      # enlaces simbólicos que pnpm crea por defecto
      - name: Dependencias
        run: |
          printf '\nnodeLinker: hoisted\n' >> pnpm-workspace.yaml
          pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build

      - name: Armar el paquete
        run: |
          out=.next/standalone
          cp -r .next/static "$out/.next/static"
          rm -rf "$out/public" && cp -r public "$out/public"
          # sharp (optimización de imágenes) completo, con sus librerías nativas de Linux:
          # el trazado de Next.js no las copia todas
          for module in sharp @img detect-libc semver; do
            rm -rf "$out/node_modules/$module"
            cp -r "node_modules/$module" "$out/node_modules/$module"
          done
          (cd "$out" && zip -qr "$GITHUB_WORKSPACE/metrica-web.zip" .)

      - uses: actions/upload-artifact@v7
        with:
          path: metrica-web.zip
          archive: false
          retention-days: 30
