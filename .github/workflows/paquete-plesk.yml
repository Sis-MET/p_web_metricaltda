# Arma el paquete del sitio para la extensión Node.js de Plesk (MegaLink): compila en Linux, como el
# servidor, y deja un zip listo para subir y descomprimir. El hosting no instala ni compila nada.
# Guía de instalación: docs/despliegue.md
name: Paquete para Plesk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  paquete:
    runs-on: ubuntu-latest
    # Base de prueba para precalentar las imágenes: el paquete arranca, aplica las migraciones y carga
    # el catálogo inicial como lo hará en el hosting (la misma versión de MariaDB que el servidor)
    services:
      mariadb:
        image: mariadb:10.3.39
        env:
          MARIADB_DATABASE: metrica
          MARIADB_USER: metrica
          MARIADB_PASSWORD: metrica
          MARIADB_RANDOM_ROOT_PASSWORD: "1"
        ports: ["3306:3306"]
        # Por TCP: responde recién cuando terminó de inicializarse
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u metrica -pmetrica --silent"
          --health-interval=5s --health-timeout=5s --health-retries=24
    steps:
      - uses: actions/checkout@v7

      # La misma versión que el hosting (Plesk no ofrece la 22 ni la 24)
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # pnpm en la versión fijada en package.json (packageManager); Node 26 ya no trae corepack
      - uses: pnpm/action-setup@v6

      # Dependencias como carpetas reales: el Administrador de archivos de Plesk no conserva los
      # enlaces simbólicos que pnpm crea por defecto
      - name: Dependencias
        run: |
          printf '\nnodeLinker: hoisted\n' >> pnpm-workspace.yaml
          pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build

      - name: Armar el paquete
        run: |
          out=.next/standalone
          cp -r .next/static "$out/.next/static"
          rm -rf "$out/public" && cp -r public "$out/public"
          # Migraciones de la base y catálogo inicial: se aplican solos al arrancar (src/instrumentation.ts)
          cp -r drizzle "$out/drizzle"
          cp -r seed "$out/seed"
          # sharp (optimización de imágenes) completo, con sus librerías nativas de Linux:
          # el trazado de Next.js no las copia todas
          for module in sharp @img detect-libc semver; do
            rm -rf "$out/node_modules/$module"
            cp -r "node_modules/$module" "$out/node_modules/$module"
          done

      # Arranca el paquete y deja en su caché las imágenes ya optimizadas: así ningún visitante espera
      # su primera codificación. Si el servidor del paquete no arranca, falla aquí y no en el hosting.
      - name: Precalentar las imágenes
        env:
          DATABASE_URL: mysql://metrica:metrica@127.0.0.1:3306/metrica
          # Fuera del paquete: los archivos de esta base de prueba no viajan en el zip
          UPLOADS_DIR: ${{ runner.temp }}/archivos
        run: |
          pnpm images:warm .next/standalone
          # Solo viajan las imágenes optimizadas: los datos en caché son de la base de prueba
          find .next/standalone/.next/cache -mindepth 1 -maxdepth 1 ! -name images -exec rm -rf {} +

      - name: Comprimir
        run: cd .next/standalone && zip -qr "$GITHUB_WORKSPACE/metrica-web.zip" .

      - uses: actions/upload-artifact@v7
        with:
          path: metrica-web.zip
          archive: false
          retention-days: 30
