<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" fill="none" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#222221"/>
      <stop offset="1" stop-color="#121211"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Ventana de la aplicación -->
  <g filter="url(#shadow)">
    <rect x="60" y="40" width="780" height="470" rx="22" fill="url(#screen)"/>
  </g>
  <rect x="60.5" y="40.5" width="779" height="469" rx="21.5" stroke="#ffffff" stroke-opacity="0.08"/>
  <path d="M60 92h780" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="92" cy="66" r="6" fill="#ffffff" fill-opacity="0.18"/>
  <circle cx="114" cy="66" r="6" fill="#ffffff" fill-opacity="0.18"/>
  <circle cx="136" cy="66" r="6" fill="#ffffff" fill-opacity="0.18"/>
  <text x="170" y="71" font-size="14" font-weight="700" fill="#ffffff" fill-opacity="0.55" letter-spacing="2">GESTIÓN DE PESAJE</text>

  <!-- Indicación de peso -->
  <rect x="92" y="120" width="330" height="170" rx="14" fill="#000000" fill-opacity="0.35"/>
  <text x="116" y="156" font-size="13" font-weight="700" fill="#ffffff" fill-opacity="0.45" letter-spacing="1.5">BÁSCULA 01 · BRUTO</text>
  <text x="116" y="232" font-size="64" font-weight="700" fill="#ffffff">41 800</text>
  <text x="358" y="232" font-size="22" font-weight="700" fill="#ffffff" fill-opacity="0.55">kg</text>
  <rect x="116" y="252" width="86" height="22" rx="11" fill="#f9e300"/>
  <text x="159" y="267" font-size="11" font-weight="700" fill="#0d0d0c" text-anchor="middle" letter-spacing="1">ESTABLE</text>

  <!-- Barras de pesajes por hora -->
  <rect x="92" y="310" width="330" height="168" rx="14" fill="#ffffff" fill-opacity="0.04"/>
  <text x="116" y="342" font-size="13" font-weight="700" fill="#ffffff" fill-opacity="0.45" letter-spacing="1.5">PESAJES POR HORA</text>
  <g fill="#ffffff" fill-opacity="0.22">
    <rect x="118" y="410" width="22" height="46" rx="4"/>
    <rect x="152" y="388" width="22" height="68" rx="4"/>
    <rect x="186" y="398" width="22" height="58" rx="4"/>
    <rect x="220" y="370" width="22" height="86" rx="4"/>
    <rect x="288" y="392" width="22" height="64" rx="4"/>
    <rect x="322" y="402" width="22" height="54" rx="4"/>
    <rect x="356" y="380" width="22" height="76" rx="4"/>
  </g>
  <rect x="254" y="358" width="22" height="98" rx="4" fill="#f9e300"/>

  <!-- Tickets recientes -->
  <text x="452" y="142" font-size="13" font-weight="700" fill="#ffffff" fill-opacity="0.45" letter-spacing="1.5">TICKETS RECIENTES</text>
  <g font-size="15">
    <rect x="452" y="160" width="356" height="56" rx="12" fill="#ffffff" fill-opacity="0.07"/>
    <text x="474" y="186" font-weight="700" fill="#ffffff">T-1048 · 2850 LPZ</text>
    <text x="474" y="205" font-size="12" fill="#ffffff" fill-opacity="0.5">Entrada · 09:42</text>
    <text x="786" y="194" font-weight="700" fill="#f9e300" text-anchor="end">41 800 kg</text>

    <rect x="452" y="226" width="356" height="56" rx="12" fill="#ffffff" fill-opacity="0.04"/>
    <text x="474" y="252" font-weight="700" fill="#ffffff" fill-opacity="0.85">T-1047 · 4127 SCZ</text>
    <text x="474" y="271" font-size="12" fill="#ffffff" fill-opacity="0.5">Salida · 09:31</text>
    <text x="786" y="260" font-weight="700" fill="#ffffff" fill-opacity="0.85" text-anchor="end">17 040 kg</text>

    <rect x="452" y="292" width="356" height="56" rx="12" fill="#ffffff" fill-opacity="0.04"/>
    <text x="474" y="318" font-weight="700" fill="#ffffff" fill-opacity="0.85">T-1046 · 3391 CBB</text>
    <text x="474" y="337" font-size="12" fill="#ffffff" fill-opacity="0.5">Entrada · 09:18</text>
    <text x="786" y="326" font-weight="700" fill="#ffffff" fill-opacity="0.85" text-anchor="end">25 100 kg</text>
  </g>

  <!-- Integración -->
  <rect x="452" y="372" width="356" height="106" rx="14" fill="#ffffff" fill-opacity="0.04"/>
  <text x="474" y="404" font-size="13" font-weight="700" fill="#ffffff" fill-opacity="0.45" letter-spacing="1.5">INTEGRACIÓN</text>
  <rect x="474" y="424" width="88" height="32" rx="8" stroke="#ffffff" stroke-opacity="0.25"/>
  <text x="518" y="445" font-size="13" font-weight="700" fill="#ffffff" fill-opacity="0.8" text-anchor="middle">Báscula</text>
  <path d="M570 440h44" stroke="#f9e300" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="622" y="424" width="88" height="32" rx="8" stroke="#ffffff" stroke-opacity="0.25"/>
  <text x="666" y="445" font-size="13" font-weight="700" fill="#ffffff" fill-opacity="0.8" text-anchor="middle">ERP</text>
  <circle cx="752" cy="440" r="14" fill="#f9e300" fill-opacity="0.15"/>
  <path d="M745 440l5 5 9-10" stroke="#f9e300" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
